
name: Build DeathDimension V2.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract source ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -name '*Source.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Source ZIP tidak ditemukan!"
            exit 1
          fi

          mkdir -p source
          unzip -o "$ZIP" -d source

      - name: Build plugin
        run: |
          POM=$(find source -name pom.xml | head -n 1)

          if [ -z "$POM" ]; then
            echo "pom.xml tidak ditemukan!"
            exit 1
          fi

          mvn -B -f "$POM" clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DeathDimension-V2.1
          path: source/**/target/*.jar
          if-no-files-found: error
